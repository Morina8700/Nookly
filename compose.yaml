services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?Set SQL_PASSWORD in .env}"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: nookly-api:local
    build:
      context: .
      dockerfile: BookMyHome.Application/Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__BookMyHome: "Server=db,1433;Database=BookMyHomeDb;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Jwt__Issuer: "BookMyHome"
      Jwt__Audience: "BookMyHome.Client"
    volumes:
      - uploads-data:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy

  client:
    image: nookly-client:local
    build:
      context: .
      dockerfile: BookMyHome.Client/Dockerfile
    pull_policy: build
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
  uploads-data:
