name: Build, check, and publish containers

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Serialize releases so overlapping pushes cannot publish out of order.
concurrency:
  group: nookly-container-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: BookMyHome.Application/Dockerfile
          load: true
          tags: nookly-api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build client
        uses: docker/build-push-action@v7
        with:
          context: .
          file: BookMyHome.Client/Dockerfile
          load: true
          tags: nookly-client:local
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Start stack with temporary CI secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sql_password="Aa1!$(openssl rand -hex 24)"
          jwt_key="$(openssl rand -hex 48)"
          echo "::add-mask::$sql_password"
          echo "::add-mask::$jwt_key"
          printf 'SQL_PASSWORD=%s\nJWT_KEY=%s\n' "$sql_password" "$jwt_key" > .env
          cat > "$RUNNER_TEMP/compose-ci.yaml" <<'YAML'
          services:
            api:
              pull_policy: never
            client:
              pull_policy: never
          YAML
          docker compose -f compose.yaml -f "$RUNNER_TEMP/compose-ci.yaml" up -d --no-build

      - name: Check fresh database migrations and client routing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/api/accommodations -o "$RUNNER_TEMP/accommodations.json"
          jq -e 'type == "array" and length >= 2' "$RUNNER_TEMP/accommodations.json" > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/accommodations \
            | grep -q 'blazor.webassembly'
          docker compose exec -T client nginx -t

      - name: Check proxy reconnects after API replacement
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f "$RUNNER_TEMP/compose-ci.yaml" \
            up -d --no-build --no-deps --force-recreate api
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/api/accommodations -o /dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Stop CI stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down --volumes
          fi

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the checked images
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY_OWNER,,}"
          for component in api client; do
            image="ghcr.io/$owner/nookly-$component"
            docker tag "nookly-$component:local" "$image:sha-$COMMIT_SHA"
            docker push "$image:sha-$COMMIT_SHA"
          done
          # Promote only after both commit-specific images are uploaded.
          # Registry tags are published separately, so deployments must tolerate a brief mismatch.
          for component in api client; do
            image="ghcr.io/$owner/nookly-$component"
            docker tag "nookly-$component:local" "$image:latest"
            docker push "$image:latest"
          done
